# =============================================================================
# Conductor OSS - Dev Environment Overrides
# =============================================================================
# Connection strings for Azure PostgreSQL and Redis in dev environment.
# ⚠️ Move passwords to Key Vault for production.
# =============================================================================

image:
  tag: "3.22.0-rc1"

env:
  # Redis host string — format: host:port:rack
  # Azure Redis SSL port 6380, non-SSL disabled
  # format: host:port:rack:password (password is 4th param for Azure Redis auth)
  # ⚠️ Replace REDIS_ACCESS_KEY with your actual Redis primary key (not stored in git)
  CONDUCTOR_REDIS_HOSTS: "ampliordev01-redis.redis.cache.windows.net:6380:us-east-1c:REDIS_ACCESS_KEY_PLACEHOLDER"

config:
  SPRING_DATASOURCE_URL: "jdbc:postgresql://ampliordev-pg.postgres.database.azure.com:5432/conductor?sslmode=require"
  SPRING_DATASOURCE_USERNAME: "conductorapp"
  SPRING_DATASOURCE_PASSWORD: "Conductor@Dev123"
